<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sideline Rugby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🏉 Sideline Rugby</h1>

<!-- Quarter Control -->
<div class="section">
    <h2>Quarter</h2>
    <div id="quarterDisplay">Quarter 1</div>
    <button onclick="nextQuarter()">Next Quarter</button>
</div>

<!-- Collision -->
<div class="section">
    <h2>Collision</h2>
    <button onclick="updateStat('gainlinePlus')">Gainline +</button>
    <button class="neg" onclick="updateStat('gainlineMinus')">Gainline -</button>
    <button onclick="updateStat('domTackPlus')">Tackle +</button>
    <button class="neg" onclick="updateStat('domTackMinus')">Tackle -</button>
</div>

<!-- Breakdown -->
<div class="section">
    <h2>Breakdown</h2>
    <button onclick="updateStat('quickBallPlus')">Quick Ball +</button>
    <button class="neg" onclick="updateStat('quickBallMinus')">Quick Ball -</button>
</div>

<!-- Scrums -->
<div class="section">
    <h2>Scrums</h2>
    <button onclick="updateStat('scrumWon')">Scrum Won</button>
    <button class="neg" onclick="updateStat('scrumLost')">Scrum Lost</button>
    <button onclick="updateStat('tightheadWon')">Tighthead Won</button>
</div>

<!-- Lineouts -->
<div class="section">
    <h2>Lineouts</h2>
    <button onclick="updateStat('lineoutWon')">Lineout Won</button>
    <button class="neg" onclick="updateStat('lineoutLost')">Lineout Lost</button>
    <button onclick="updateStat('maulPlus')">Maul +</button>
    <button class="neg" onclick="updateStat('maulMinus')">Maul -</button>
</div>

<!-- Discipline -->
<div class="section">
    <h2>Discipline</h2>
    <button onclick="updateStat('turnoverWon')">Turnover Won</button>
    <button class="neg" onclick="updateStat('turnoverLost')">Turnover Lost</button>
    <button class="warn" onclick="updateStat('penalties')">Penalty</button>
    <button class="neg" onclick="updateStat('knockOn')">Knock On</button>
</div>

<!-- Live Stats -->
<div class="section">
    <h2>Live Stats</h2>
    <div id="statsOutput"></div>
</div>

<div class="section">
    <button style="background:red;" onclick="resetMatch()">Reset Match</button>
</div>

<script src="app.js"></script>

</body>
</html>
