<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sideline Rugby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🏉 Sideline Rugby</h1>

<div class="top-bar">
    <span id="time">00:00</span>
    <span id="momentum">Momentum: Neutral</span>
</div>

<div class="section">
    <h2>Collision</h2>
    <button onclick="updateStat('gainlinePlus')">Gainline +</button>
    <button onclick="updateStat('gainlineMinus')" class="neg">Gainline -</button>

    <button onclick="updateStat('domTackPlus')">Dom Tack +</button>
    <button onclick="updateStat('domTackMinus')" class="neg">Dom Tack -</button>
</div>

<div class="section">
    <h2>Breakdown</h2>
    <button onclick="updateStat('quickBallPlus')">Quick Ball +</button>
    <button onclick="updateStat('quickBallMinus')" class="neg">Quick Ball -</button>
</div>

<div class="section">
    <h2>Discipline</h2>
    <button onclick="updateStat('turnoverWon')">Turnover Won</button>
    <button onclick="updateStat('turnoverLost')" class="neg">Turnover Lost</button>
    <button onclick="updateStat('penalties')" class="warn">Penalty</button>
</div>
<button onclick="resetMatch()" style="background:red;">Reset Match</button>

<div class="stats">
    <h2>Live Stats</h2>
    <div id="statsOutput"></div>
</div>
<script src="app.js"></script>


<script src="app.js"></script></body>
</html>
